name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # arashouse runs natively on Windows (NTFS locks and renames, named pipes, the beacon, PowerShell): windows-latest is
    # where those are tested continuously; ubuntu-latest covers the same code on Linux.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
